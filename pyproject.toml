[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "semmeddb_procedure_ingest"
description = "SemMedDB literature-derived procedure→disease/phenotype (diagnoses/treats) edges, grounded to SNOMED/NCIT/MONDO/HP with NodeNorm+MRCONSO and structural-IC filtering"
authors = [
  {name = "Kevin Schaper", email = "kevin@tislab.org"},
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dynamic = ["version"]

dependencies = [
  "koza>=2.0.0",
  "biolink-model>=4.0.0",
  "kghub-downloader>=0.3.0",
  "kozahub-metadata-schema",
  "requests>=2.28.0",
  "duckdb>=1.4",            # preprocessing joins/IC over the source subset
  "umls-downloader>=0.1",   # credentialed SNOMED RF2 + MRCONSO fetch (download only; reader is broken)
  "bioversions",            # required transitive of umls-downloader's versioned download path
]

[tool.uv.sources]
kozahub-metadata-schema = { git = "https://github.com/monarch-initiative/kozahub-metadata-schema", rev = "main" }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
