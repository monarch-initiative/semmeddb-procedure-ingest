# Download configuration for semmeddb-procedure-ingest
#
# OPEN, redistributable sources only. License-gated sources (SNOMED CT RF2,
# UMLS MRCONSO) are NOT listed here — they are fetched by scripts/fetch_licensed.py
# using UMLS_API_KEY, cached in the shared pystow store, gitignored, and NEVER
# re-emitted. See ARCHITECTURE.md.

# --- Primary source: the LLM-verified SemMedDB subset, sliced to this ingest ---
# The upstream subset is ~6.2 GB / 26.7M predications across all predicates. This
# ingest reads two predicates and eight columns of it, which is ~15 MB — so the
# published artifact is the SLICE (scripts/make_source_subset.py), served as a
# plain GitHub release asset. No bucket or Zenodo deposit needed.
- url: "https://github.com/monarch-initiative/semmeddb-procedure-ingest/releases/download/{SUBSET_RELEASE_TAG}/semmeddb_subset.parquet"
  local_name: "data/semmeddb_subset.parquet"

# --- NodeNorm categorisation snapshot ---
# NodeNorm is a moving target, so the categories/normalized_ids are snapshotted and
# shipped as a versioned artifact rather than re-fetched per build. Without this the
# build silently hits the live API and the "pinned" version in the receipt is a lie.
- url: "https://github.com/monarch-initiative/semmeddb-procedure-ingest/releases/download/{SUBSET_RELEASE_TAG}/nodes_snapshot.parquet"
  local_name: "data/nodes_snapshot.parquet"

# --- NCIt (public domain): code->UMLS_CUI (<P207>) + procedure hierarchy for structural IC ---
- url: "https://evs.nci.nih.gov/ftp1/NCI_Thesaurus/Thesaurus.FLAT.zip"
  local_name: "data/ncit_flat.zip"
- url: "https://evs.nci.nih.gov/ftp1/NCI_Thesaurus/Thesaurus.OWL.zip"
  local_name: "data/ncit_owl.zip"

# --- Monarch mapping commons (open): UMLS/SNOMED -> MONDO, SNOMED -> HP ---
# NOTE: mondo.sssom.tsv is no longer carried in monarch-mapping-commons (that
# path 404s now); it ships with the Mondo release itself.
- url: "http://purl.obolibrary.org/obo/mondo/mappings/mondo.sssom.tsv"
  local_name: "data/mondo.sssom.tsv"
- url: "https://raw.githubusercontent.com/monarch-initiative/monarch-mapping-commons/main/mappings/hpo-snomed.sssom.tsv"
  local_name: "data/hpo-snomed.sssom.tsv"

# --- MONDO + HP class hierarchy (open): subclass edges for disease/phenotype IC ---
# Canonical OBO releases rather than a Monarch KG dump: the IC we want is over the
# ontology's own hierarchy, these self-version via their `data-version:` header,
# and it is ~64 MB instead of a 330 MB tarball. build_subclass_edges.py turns them
# into data/mondo_edges.tsv.
- url: "http://purl.obolibrary.org/obo/mondo.obo"
  local_name: "data/mondo.obo"
- url: "http://purl.obolibrary.org/obo/hp.obo"
  local_name: "data/hp.obo"
